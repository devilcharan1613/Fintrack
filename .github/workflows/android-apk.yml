name: Build FinTrack APK

on:
  push:
    branches: [main, fintrack-2.5.0-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fintrack-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\\b([^>]*)>(.*?)</script\\s*>', html, flags=re.IGNORECASE | re.DOTALL)
          count = 0
          for attrs, body in blocks:
              if re.search(r'\\bsrc\\s*=', attrs, flags=re.IGNORECASE) or not body.strip():
                  continue
              target = Path(f"/tmp/fintrack-inline-{count}.js")
              target.write_text(body, encoding="utf-8")
              count += 1
          if count == 0:
              raise SystemExit("No inline JavaScript blocks found")
          print(f"Extracted {count} inline JavaScript blocks")
          PY
          for script in /tmp/fintrack-inline-*.js; do node --check "$script"; done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' SDK package was removed. Gradle fetches the compile/build tools it needs.
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebugAndroidTest assembleDebug

      - name: Run Android instrumented tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
