name: Build FinTrack APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fintrack-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Node.js for embedded JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          for index, script in enumerate(scripts):
              pathlib.Path(f'/tmp/fintrack-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Extracted {len(scripts)} JavaScript block(s)')
          PY
          for script in /tmp/fintrack-inline-*.js; do node --check "$script"; done

      - name: Build debug APK and run JVM tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            set +e
            mkdir -p app/build/ci-diagnostics
            echo "ADB devices before test:" > app/build/ci-diagnostics/emulator-preflight.txt
            adb devices -l >> app/build/ci-diagnostics/emulator-preflight.txt 2>&1
            # The hosted emulator can briefly appear as "offline" while booting.
            # Reconnect it and wait for Android's boot-completed property before Gradle.
            adb reconnect offline >> app/build/ci-diagnostics/emulator-preflight.txt 2>&1
            adb wait-for-device
            booted=0
            for attempt in $(seq 1 180); do
              state=$(adb get-state 2>/dev/null)
              if [ "$state" = "device" ]; then
                completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
                if [ "$completed" = "1" ]; then
                  booted=1
                  break
                fi
              else
                adb reconnect offline >/dev/null 2>&1 || true
              fi
              sleep 5
            done
            if [ "$booted" -ne 1 ]; then
              echo "Emulator did not reach sys.boot_completed=1" | tee -a app/build/ci-diagnostics/emulator-preflight.txt
              adb devices -l >> app/build/ci-diagnostics/emulator-preflight.txt 2>&1
              adb logcat -d -v threadtime > app/build/ci-diagnostics/logcat.txt 2>&1
              exit 1
            fi
            echo "Emulator boot completed after preflight." | tee -a app/build/ci-diagnostics/emulator-preflight.txt
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
            test_status=$?

            adb devices -l > app/build/ci-diagnostics/adb-devices.txt 2>&1
            adb logcat -d -v threadtime > app/build/ci-diagnostics/logcat.txt 2>&1
            adb shell dumpsys activity instrumentation > app/build/ci-diagnostics/instrumentation.txt 2>&1
            adb shell getprop > app/build/ci-diagnostics/device-properties.txt 2>&1
            if [ "$test_status" -ne 0 ]; then
              echo "Instrumentation tests failed; crash diagnostics:"
              grep -E -i 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_RESULT|Process.*died|crash|Exception|am_crash' app/build/ci-diagnostics/logcat.txt | tail -n 250 || true
            fi
            exit "$test_status"

      - name: Upload test reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-test-diagnostics
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
