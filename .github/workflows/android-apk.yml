name: Build FinTrack APK

on:
  push:
    branches: [main, fintrack-2.5.0-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate commits so an older emulator boot cannot hold up a newer fixed APK.
  group: fintrack-apk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble debug APK
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, flags=re.IGNORECASE | re.DOTALL)
          count = 0
          for attrs, body in blocks:
              if re.search(r'\bsrc\s*=', attrs, flags=re.IGNORECASE) or not body.strip():
                  continue
              target = Path(f"/tmp/fintrack-inline-{count}.js")
              target.write_text(body, encoding="utf-8")
              count += 1
          if count == 0:
              raise SystemExit("No inline JavaScript blocks found")
          print(f"Extracted {count} inline JavaScript blocks")
          PY
          for script in /tmp/fintrack-inline-*.js; do node --check "$script"; done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy 'tools' SDK package was removed. Gradle fetches the compile/build tools it needs.
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fintrack-debug-signing-key-v1

      - name: Create debug signing key when not cached
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Save stable debug signing key immediately
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: fintrack-debug-signing-key-v1

      - name: Build debug APK
        id: build_apk
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebugAndroidTest assembleDebug

      - name: Upload APK
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android instrumented tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest

